[package]
name = "middleware-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Hot Path: exakt auf die flatc-Version gepinnt (CLAUDE.md §5).
flatbuffers = "=24.3.25"
# cmake-build: baut librdkafka aus den Quellen, dafür braucht die Build-Stage
# cmake + build-essential (siehe Dockerfile).
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
rand = "0.8"
# Nur für die RFC3339-Zeitstempel der Kontrakte (§8/§9) — kein neues Framework.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# ANMERKUNG zur Toolchain (CLAUDE.md §5 pinnt Rust 1.83): mehrere transitive
# Abhängigkeiten der ebenfalls gepinnten rdkafka-0.36-Kette (toml_edit 0.25 über
# num_enum/proc-macro-crate, indexmap 2.14) verlangen inzwischen `edition2024`,
# das Cargo 1.83 nicht kennt. Einzeln zu pinnen wäre ein Rattenschwanz und bei
# jedem `cargo update` erneut fällig — daher baut der Service mit Rust 1.85
# (erste Version mit stabilem edition2024). Kein Major-Sprung, keine
# Code-Änderung; die Crate-Versionen selbst bleiben wie in §5 festgelegt.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
