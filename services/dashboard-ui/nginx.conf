server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Gehashte Assets sind unveränderlich, index.html darf nie im Cache kleben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-Fallback. /api und /ws routet Caddy (Schritt 06) direkt an
    # middleware-core — sie erreichen nginx nie.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
