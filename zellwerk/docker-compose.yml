# =============================================================================
# zellwerk — Digitale Musterfabrik + KI-native Middleware (SPEC.md §3)
# -----------------------------------------------------------------------------
# Profile:
#   sim    Musterfabrik: 6 OPC-UA-Stationen + Mock-ERP
#   core   UNS (EMQX), TimescaleDB, Konnektor, Ingest
#   obs    Grafana
#   ai     zellwerk-llm (LLM-Zugang) + MCP-Server + Agenten
#
#   make up      → sim + core + obs (die Fabrik läuft und wird sichtbar)
#   make up-ai   → zusätzlich die KI-Schicht
#
# Netzentwurf (docs/decisions.md D3):
#   backend  internal: true — KEIN Internet. Hier hängt alles.
#   egress   normal        — hier hängt AUSSCHLIESSLICH zellwerk-llm.
# Damit gibt es genau einen kontrollierten Weg nach draußen, und der führt zu
# api.anthropic.com. Kein anderer Dienst kann versehentlich telefonieren.
# =============================================================================
name: zellwerk

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-python: &python
  <<: *common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &pyenv
    ZW_MQTT_HOST: emqx
    ZW_MQTT_PORT: "1883"
    ZW_DB_DSN: postgresql://zellwerk:${ZW_DB_PASSWORD:-zellwerk}@timescaledb:5432/zellwerk
    ZW_SITE: ${ZW_SITE:-werk1}
    # Takt und Zeitraffer MÜSSEN hier stehen: ohne Eintrag erreicht ein
    # `ZW_SPEED=30 docker compose up` den Container nicht, und die Fabrik läuft
    # weiter in Echtzeit — ohne jede Fehlermeldung.
    ZW_TICK_S: ${ZW_TICK_S:-1.0}
    ZW_SPEED: ${ZW_SPEED:-1.0}
    PYTHONUNBUFFERED: "1"

networks:
  backend:
    internal: true
  # Ausgehend: ausschließlich für den LLM-Zugang.
  egress: {}
  # Eingehend: für den Edge. Ein Container, der NUR in einem internal-Netz
  # hängt, kann keine Ports veröffentlichen — Docker hat dann keine Route aus
  # dem Host-Namespace, und der Container startet klaglos ohne Portbindung.
  # Deshalb ein eigenes, nicht-internes Netz statt `egress` mitzubenutzen:
  # der Edge soll erreichbar sein, aber selbst nicht ins Internet können.
  edge: {}

volumes:
  timescale-data:
  emqx-data:
  grafana-data:
  caddy-data:
  caddy-config:

services:

  # ---------------------------------------------------------------- UNS -----
  # Broker und Datenbank tragen BEWUSST kein Profil: sie sind Infrastruktur, von
  # der mehrere Profile abhängen. Lagen sie in `core`, brach `--profile sim`
  # allein mit "depends on undefined service emqx" ab — eine Abhängigkeit über
  # eine Profilgrenze hinweg ist in Compose kein gültiges Projekt.
  emqx:
    <<: *common
    image: emqx:5.8
    container_name: zellwerk-emqx
    networks: [backend]
    environment:
      EMQX_NODE__COOKIE: zellwerk
      # ÄNDERN, sobald der Broker von außen erreichbar ist. Diese Variable
      # wirkt zudem NUR beim ersten Start eines frischen Volumes; an einer
      # bestehenden Installation setzt man das Passwort mit
      #   emqx ctl admins passwd admin <neues>
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${ZW_EMQX_PASSWORD:-zellwerk-demo}
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------ Datenbank ---
  timescaledb:
    <<: *common
    image: timescale/timescaledb-ha:pg16
    container_name: zellwerk-timescaledb
    networks: [backend]
    environment:
      POSTGRES_DB: zellwerk
      POSTGRES_USER: zellwerk
      POSTGRES_PASSWORD: ${ZW_DB_PASSWORD:-zellwerk}
    volumes:
      - timescale-data:/home/postgres/pgdata
      - ./packages/core/ingest/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zellwerk -d zellwerk"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --------------------------------------------------------- Musterfabrik ---
  # Alle sechs Stationen laufen in EINEM Container, jede als eigener
  # OPC-UA-Server auf eigenem Port (4841–4846) — ein Prozess je Station wäre
  # sechs fast identische Container für nichts.
  simfactory:
    <<: *python
    container_name: zellwerk-simfactory
    profiles: ["sim"]
    networks: [backend]
    command: ["python", "-m", "simfactory.main"]
    environment:
      <<: *pyenv
      ZW_ERP_URL: http://erp-mock:8000
    ports: []
    depends_on:
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "simfactory.selfcheck"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  erp-mock:
    <<: *python
    container_name: zellwerk-erp-mock
    profiles: ["sim"]
    networks: [backend]
    command: ["uvicorn", "simfactory.erp_mock.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------ Konnektor ---
  connector:
    <<: *python
    container_name: zellwerk-connector
    profiles: ["core"]
    networks: [backend]
    command: ["python", "-m", "connector.main"]
    volumes:
      - ./packages/connector/config.yaml:/app/connector-config.yaml:ro
    environment:
      <<: *pyenv
      ZW_CONNECTOR_CONFIG: /app/connector-config.yaml
    depends_on:
      emqx:
        condition: service_healthy

  # --------------------------------------------------------------- Ingest ---
  ingest:
    <<: *python
    container_name: zellwerk-ingest
    profiles: ["core"]
    networks: [backend]
    command: ["python", "-m", "core.ingest.main"]
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # ------------------------------------------------------------ Edge-Rules --
  # Der deterministische <1s-Pfad (SPEC §8.3). Läuft bewusst als eigener Dienst
  # neben dem Ingest: der Regelpfad darf nicht warten, bis ein Datenbankschreiber
  # fertig ist.
  rules:
    <<: *python
    container_name: zellwerk-rules
    profiles: ["core"]
    networks: [backend]
    command: ["python", "-m", "core.rules.main"]
    volumes:
      - ./packages/core/rules/rules.yaml:/app/core/rules/rules.yaml:ro
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # ----------------------------------------------------------- Sichtbarkeit -
  grafana:
    <<: *common
    image: grafana/grafana-oss:11.3.0
    container_name: zellwerk-grafana
    profiles: ["obs"]
    networks: [backend]
    environment:
      # ÄNDERN vor jedem Betrieb, der über den eigenen Rechner hinausgeht.
      # Wirkt NUR beim ersten Start eines frischen Volumes; danach hilft nur
      #   grafana cli admin reset-admin-password <neues>
      GF_SECURITY_ADMIN_PASSWORD: ${ZW_GRAFANA_PASSWORD:-zellwerk-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Hinter einem Reverse-Proxy MUSS Grafana seine öffentliche Adresse
      # kennen, sonst zeigen Weiterleitungen nach dem Login auf den internen
      # Containernamen und die Anmeldung endet im Nichts.
      # Öffentliche Adresse — MUSS in der .env auf den eigenen Hostnamen
      # gesetzt werden. Der Standard passt nur für den lokalen Betrieb; hinter
      # einem Reverse-Proxy zeigen Weiterleitungen sonst ins Leere.
      GF_SERVER_ROOT_URL: ${ZW_GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SERVER_DOMAIN: ${ZW_GRAFANA_DOMAIN:-localhost}
      # Der Proxy setzt X-Forwarded-*; ohne dieses Flag hält Grafana jede
      # Anfrage für lokal und protokolliert die falsche Herkunft.
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # Startseite ist das Linien-Dashboard, NICHT Grafanas Willkommensseite.
      # Ohne das landet jeder nach dem Login auf "Welcome to Grafana" mit
      # "Add your first data source" — das sieht aus wie eine leere
      # Neuinstallation, obwohl Datenquelle und Dashboard längst da sind.
      # Wer die Adresse aufruft, will die Anlage sehen, kein Tutorial.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/linie.json
      # Werbe- und Neuigkeiten-Panels aus: sie holen Inhalte von außen, was in
      # diesem Netz ohnehin nicht geht, und lenken vom Wesentlichen ab.
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # MUSS hier stehen: die provisionierte Datenquelle enthält
      # `${ZW_DB_PASSWORD}`, und Grafana löst diesen Platzhalter aus SEINER
      # eigenen Umgebung auf — nicht aus der von Compose. Fehlt die Variable,
      # expandiert sie zu einem leeren Passwort. Die Datenquelle taucht dann
      # in der Oberfläche völlig normal auf und jede Abfrage scheitert mit
      # "password authentication failed".
      ZW_DB_PASSWORD: ${ZW_DB_PASSWORD:-zellwerk}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/json:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  # -------------------------------------------------------------- KI-Schicht
  # MCP-Server: stellt das Fabrikmodell als Werkzeuge bereit (SPEC §9).
  # Läuft im SSE-Modus, damit Dienste im Compose-Netz ihn erreichen; für Claude
  # Desktop/Code lässt sich dasselbe Modul über stdio starten.
  mcpserver:
    <<: *python
    container_name: zellwerk-mcp
    profiles: ["ai"]
    networks: [backend]
    command: ["python", "-m", "mcpserver.server", "--http"]
    environment:
      <<: *pyenv
      ZW_LIVE_ACTIONS: ${ZW_LIVE_ACTIONS:-false}
    depends_on:
      timescaledb:
        condition: service_healthy

  # Die Agenten sind über HTTP erreichbar, nicht nur über die Kommandozeile.
  # Ohne das wären sie in einer Vorführung unsichtbar — und der Agent, der eine
  # Ursache findet und belegt, ist der eigentliche Gegenstand dieses Systems.
  # Die Kommandozeile bleibt zusätzlich nutzbar:
  #   docker compose exec agents python -m agents.runner triage
  agents:
    <<: *python
    container_name: zellwerk-agents
    profiles: ["ai"]
    networks: [backend]
    command: ["uvicorn", "agents.api:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: *pyenv
      ZW_LLM_BASE_URL: ${ZW_LLM_BASE_URL:-http://zellwerk-llm:4010}
      ZW_MODEL: ${ZW_MODEL:-claude-haiku-4-5-20251001}
      ZW_LIVE_ACTIONS: ${ZW_LIVE_ACTIONS:-false}
    depends_on:
      timescaledb:
        condition: service_healthy

  # ------------------------------------------------------------------ Edge --
  # Öffentliche URLs. Belegt in der inneren Engine 80/443 — dieselben Ports,
  # die der Host auf 8090/8453 abbildet. Hat den Platz des vorherigen Projekts
  # übernommen, weshalb auch dessen bisherige Adresse hier landet.
  #
  # `edge`-Profil: `make up` lässt den Stack rein intern laufen, erst
  # `--profile edge` macht ihn öffentlich.
  caddy:
    <<: *common
    image: caddy:2.8-alpine
    container_name: zellwerk-caddy
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZELLWERK_HOST: ${ZELLWERK_HOST:-}
      LEGACY_HOST: ${LEGACY_HOST:-}
      CONSOLE_HOST: ${ZW_CONSOLE_HOST:-}
      AGENTS_HOST: ${ZW_AGENTS_HOST:-}
      FACTORY_HOST: ${ZW_FACTORY_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # `edge` für die Erreichbarkeit von außen, `backend` um die Dienste zu
    # erreichen. NICHT `egress` — der Edge soll keine ausgehende Verbindung
    # aufbauen können; diese Tür bleibt dem LLM-Zugang vorbehalten.
    networks: [backend, edge]
    mem_limit: 256m

  # Der EINZIGE Dienst mit einem Bein im egress-Netz. Siehe decisions.md D1/D3.
  zellwerk-llm:
    <<: *common
    build:
      context: ./services/zellwerk-llm
    container_name: zellwerk-llm
    profiles: ["ai"]
    networks: [backend, egress]
    environment:
      ZELLWERK_MODEL: ${ZW_MODEL:-claude-haiku-4-5-20251001}
    # Der Token liegt ausschließlich im RAM. Nach einem Neustart ist er weg;
    # zellwerk-creds-sync (systemd-Timer auf dem Host, alle 5 min) legt ihn neu
    # ab. Bis dahin meldet /health ehrlich rot statt still zu scheitern.
    tmpfs:
      - /creds
